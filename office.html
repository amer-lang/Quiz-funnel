<script>
(function(){
'use strict';
var PREVIEW = null;
/* test login for preview deployments only: #pp=…&cs=… (a fragment, so it never reaches a server log or a Referer) */
try{
  var HP = new URLSearchParams(location.hash.replace(/^#/, ''));
  if(HP.get('pp') && HP.get('cs')){
    PREVIEW = { pp: HP.get('pp'), cs: HP.get('cs') };
    sessionStorage.setItem('emp_preview', JSON.stringify(PREVIEW));
    history.replaceState(null, '', location.pathname);
  }else{ PREVIEW = JSON.parse(sessionStorage.getItem('emp_preview') || 'null'); }
}catch(e){}

/* ---------- helpers ---------- */
function h(tag, attrs){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'on'){ for(var ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); }
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
  }
  (function add(list){
    for(var i = 0; i < list.length; i++){
      var c = list[i];
      if(c === null || c === undefined || c === false) continue;
      if(Array.isArray(c)) add(c);
      else e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    }
  })(Array.prototype.slice.call(arguments, 2));
  return e;
}
function $(id){ return document.getElementById(id); }
/* only https links to our own hosts or the buyer's Shopify admin are ever put in href/src */
function safeUrl(u){
  try{ var x = new URL(u); return x.protocol === 'https:' && (/\.myshopify\.com$/.test(x.hostname) || x.hostname === 'chat.dropstart.app' || x.hostname === 'dropstart.app') ? x.href : ''; }catch(e){ return ''; }
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); return n; }
var toastT;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 2600); }
function ago(iso){
  if(!iso) return '';
  var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if(isNaN(s)) return '';
  if(s < 90) return 'just now'; if(s < 5400) return Math.round(s / 60) + ' min ago';
  if(s < 129600) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' days ago';
}
function inTime(iso){
  if(!iso) return '';
  var s = (new Date(iso).getTime() - Date.now()) / 1000;
  if(s < 90) return 'any minute'; if(s < 5400) return 'in ' + Math.round(s / 60) + ' min';
  if(s < 129600) return 'in ' + Math.round(s / 3600) + ' h'; return 'in ' + Math.round(s / 86400) + ' days';
}
/* HTML -> readable text lines, without ever inserting the HTML into the page */
function htmlToText(html){
  var d = new DOMParser().parseFromString('<body>' + String(html || '') + '</body>', 'text/html'), out = [];
  d.body.querySelectorAll('h2,h3,h4,p,li').forEach(function(n){
    var t = n.textContent.replace(/\s+/g, ' ').trim();
    if(t) out.push((n.tagName === 'LI' ? '• ' : '') + t);
  });
  return out.length ? out.join('\n\n').replace(/\n\n• /g, '\n• ') : d.body.textContent.trim();
}
var VERB = { reply_send:'Customer reply', seo_meta:'Search listing', alt_text:'Image descriptions', description:'Product description', title:'Product title', article:'Blog article', report:'Report', info:'Note', todo:'To do' };
var STATUS = { applied:'Done', proposed:'Waiting for you', rejected:'Not applied', skipped:'Skipped', failed:"Couldn't apply", expired:'Expired', applying:'Working', undoing:'Working', undone:'Undone', open:'' };
function describe(a){
  var b = a.before || {}, n = a.after || {}, B = '', A = '';
  if(a.verb === 'seo_meta'){
    B = [b.seo_title !== undefined ? 'Title: ' + (b.seo_title || '(empty)') : '', b.seo_description !== undefined ? 'Description: ' + (b.seo_description || '(empty)') : ''].filter(Boolean).join('\n\n');
    A = [n.seo_title !== undefined ? 'Title: ' + n.seo_title : '', n.seo_description !== undefined ? 'Description: ' + n.seo_description : ''].filter(Boolean).join('\n\n');
  }else if(a.verb === 'alt_text'){
    B = Object.keys(b.alts || {}).map(function(){ return '(no description)'; }).join('\n');
    A = Object.keys(n.alts || {}).map(function(k){ return n.alts[k]; }).join('\n\n');
  }else if(a.verb === 'description'){ B = htmlToText(b.descriptionHtml); A = htmlToText(n.descriptionHtml); }
  else if(a.verb === 'title'){ B = b.title || ''; A = n.title || ''; }
  else if(a.verb === 'article'){ B = ''; A = (n.title || '') + '\n\n' + (n.summary ? n.summary + '\n\n' : '') + htmlToText(n.body_html); }
  /* what the text holds that this view cannot show: pictures, videos, tables, links */
  var warn = '';
  if(a.verb === 'description' && b.descriptionHtml){
    var d = new DOMParser().parseFromString('<body>' + b.descriptionHtml + '</body>', 'text/html'), m = d.body.querySelectorAll('img,picture,iframe,video,audio,table,svg').length, l = d.body.querySelectorAll('a').length;
    if(m || l) warn = 'This text also has ' + [m ? m + ' picture, video or table item' + (m > 1 ? 's' : '') : '', l ? l + ' link' + (l > 1 ? 's' : '') : ''].filter(Boolean).join(' and ') + ' that this change would not keep.';
  }
  return { before: B, after: A, warn: warn, cut: !!a.truncated };
}

/* ---------- api ---------- */
function api(route, o){
  o = o || {};
  var qs = new URLSearchParams(Object.assign({ r: route }, o.q || {}));
  var hd = { 'Content-Type': 'application/json' };
  if(PREVIEW){ hd['x-preview-pass'] = PREVIEW.pp; hd['x-preview-cs'] = PREVIEW.cs; }
  return fetch('/api/office?' + qs, { method: o.method || 'GET', headers: hd, credentials: 'same-origin', body: (o.method && o.method !== 'GET') ? JSON.stringify(o.body || {}) : undefined })
    .then(function(r){ return r.json().catch(function(){ return { ok:false }; }).then(function(j){ return { status: r.status, j: j }; }); })
    .catch(function(){ return { status: 0, j: { ok:false, error:'offline' } }; });
}

/* ---------- state ---------- */
var S = { office: null, approvals: [], ledger: [], cursor: null, creatives: [], loaded: false, view: 'home', sec: null, sel: null, f: null, threads: [], threadCursor: null, tf: 'needs', tfTouched: false, sset: null, mgrLedger: [] };

/* the team: the same names and faces for every customer (team.js) */
var T = window.TEAM || {};
function who(role){ return T[role] || { name: 'Your employee', title: role || '', img: '' }; }
function av(role, size){
  var w = who(role);
  return h('span', { class: 'av' + (size ? ' ' + size : '') }, w.img ? h('img', { src: w.img, alt: '', width: '64', height: '64', decoding: 'async' }) : null);
}
var JOB = { onboard_audit: 'getting to know your store', rewrite_product: 'writing product text', blog_article: 'writing a blog article', product_check: 'checking your products',
  health_scan: 'scanning your store', weak_page_refresh: 'freshening up a weak page', launch_set: 'making your first ads', monthly_refresh: 'making this month\'s ads',
  seasonal_set: 'making seasonal ads', product_poll: 'looking for new products', more_like_this: 'making more ads like the one you liked' };
JOB.baseline = 'getting to know your orders'; JOB.daily_check = 'checking your orders'; JOB.weekly_report = 'writing your weekly report'; JOB.sweep = 'tidying my inbox'; JOB.setup = 'getting my inbox ready';
function autoOn(e){ return !!e && e.mode === 'autopilot' && !!(S.office && S.office.autopilot_available); }
function hasRole(role){ return !!S.office && S.office.hires.some(function(x){ return x.role === role; }); }
function hireOf(role){ return S.office.hires.filter(function(x){ return x.role === role; })[0] || null; }
function scoped(list){ return S.sel ? list.filter(function(a){ return a.role === S.sel; }) : list; }

/* ---------- confirm sheet: a bottom sheet on phones, a centred card on larger screens ---------- */
var modalOpen = false;
function confirmModal(o){
  return new Promise(function(resolve){
    if(modalOpen){ resolve(false); return; }
    modalOpen = true;
    var prev = document.activeElement, done = false;
    var back = h('div', { class: 'mback' }), sheet = h('div', { class: 'msheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'mtitle', 'aria-describedby': 'mbody', tabindex: '-1' });
    function onKey(ev){
      if(ev.key === 'Escape'){ ev.preventDefault(); ev.stopPropagation(); close(false); return; }
      if(ev.key !== 'Tab') return;
      var f = sheet.querySelectorAll('button'); if(!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if(ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
      else if(!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
    }
    function close(v){
      if(done) return; done = true;
      document.removeEventListener('keydown', onKey, true);
      back.classList.remove('in'); if(!sheetOpen) document.body.classList.remove('modal-on');
      setTimeout(function(){
        if(back.parentNode) back.parentNode.removeChild(back);
        modalOpen = false;
        if(prev && prev.focus){ try{ prev.focus(); }catch(e){} }
        resolve(v);
      }, 230);
    }
    var ok = h('button', { class: (o.danger ? 'btn-red' : 'btn-gold') + ' mok', type: 'button', on: { click: function(){ close(true); } } }, o.ok || 'Confirm');
    var no = h('button', { class: 'mno', type: 'button', on: { click: function(){ close(false); } } }, o.cancel || 'Cancel');
    sheet.appendChild(h('div', { class: 'mgrab', 'aria-hidden': 'true' }));
    if(o.role) sheet.appendChild(h('div', { class: 'mface' }, av(o.role, 'lg')));
    sheet.appendChild(h('h2', { id: 'mtitle' }, o.title));
    sheet.appendChild(h('div', { id: 'mbody', class: 'mbody' }, o.text ? h('p', null, o.text) : null,
      o.points ? h('ul', { class: 'mpts' }, o.points.map(function(p){ return h('li', null, h('span', { class: 'mi', 'aria-hidden': 'true' }, p[0]), h('span', null, p[1])); })) : null));
    sheet.appendChild(h('div', { class: 'mbtns' }, ok, no));
    /* phones: drag the sheet down to dismiss */
    var y0 = null, dy = 0;
    sheet.addEventListener('touchstart', function(ev){ if(ev.target.closest('.mgrab,h2,.mface')) y0 = ev.touches[0].clientY; }, { passive: true });
    sheet.addEventListener('touchmove', function(ev){ if(y0 === null) return; dy = Math.max(0, ev.touches[0].clientY - y0); sheet.style.transition = 'none'; sheet.style.transform = 'translateY(' + dy + 'px)'; }, { passive: true });
    sheet.addEventListener('touchend', function(){
      if(y0 === null) return;
      var d = dy; y0 = null; dy = 0; sheet.style.transition = '';
      if(d > 90){ sheet.style.transform = 'translateY(100%)'; close(false); } else sheet.style.transform = '';
    });
    back.appendChild(sheet);
    back.addEventListener('mousedown', function(ev){ if(ev.target === back) close(false); });
    document.body.appendChild(back); document.body.classList.add('modal-on');
    document.addEventListener('keydown', onKey, true);
    requestAnimationFrame(function(){ back.classList.add('in'); (o.focusCancel ? no : ok).focus(); });
  });
}

function loadAll(opt){
  opt = opt || {};
  return api('office').then(function(o){
    if(o.status === 401){ return showLogin(); }
    if(o.status === 404 || (o.j && o.j.error === 'not_available')){ return showMessage('The AI Team isn\'t available yet.', 'warn'); }
    if(!o.j || !o.j.ok){ return showMessage('We couldn\'t load your team just now. Please try again in a minute.', 'bad'); }
    o.j.hires = (o.j.hires || []).filter(function(x){ return x.hire_status !== 'ended'; }); /* people whose time with you has ended are not on the team */
    S.office = o.j; $('previewbar').hidden = !o.j.preview;
    /* only ask for what can have changed: approvals when something is waiting, the gallery when it is open or just changed */
    var wantCreatives = hasRole('designer') && (opt.creatives || !S.loaded || S.sec === 'gallery');
    var sup = hasRole('support') && !!hireOf('support').employee, mgrEmp = hasRole('manager') ? hireOf('manager').employee : null;
    return Promise.all([
      o.j.pending_approvals ? api('approvals') : Promise.resolve({ j: { items: [] } }),
      api('ledger'),
      wantCreatives ? api('creatives') : Promise.resolve(null),
      sup ? Promise.all([api('threads'), api('threads', { q: { status: 'needs_owner' } }), api('threads', { q: { status: 'draft_ready' } })]) : Promise.resolve(null),
      sup ? api('ssettings') : Promise.resolve(null),
      mgrEmp ? api('ledger', { q: { employee: mgrEmp.id } }) : Promise.resolve(null)
    ]).then(function(r){
      S.approvals = (r[0].j && r[0].j.items) || [];
      S.ledger = (r[1].j && r[1].j.items) || []; S.cursor = r[1].j && r[1].j.next_cursor;
      if(r[2]) S.creatives = (r[2].j && r[2].j.items) || [];
      if(r[3] && r[3][0].j && r[3][0].j.ok) mergeThreads(r[3]); else if(!sup){ S.threads = []; S.threadCursor = null; }
      if(r[4] && r[4].j && r[4].j.ok) S.sset = r[4].j; else if(!sup) S.sset = null;
      S.mgrLedger = r[5] && r[5].j && r[5].j.items ? r[5].j.items : (mgrEmp ? S.mgrLedger : []);
      S.loaded = true; render();
    });
  });
}
function showMessage(msg, kind){ clear($('home')); clear($('banner')).appendChild(h('div', { class: 'banner ' + (kind || '') }, msg)); }
function showLogin(){
  clear($('home')); clear($('banner'));
  $('banner').appendChild(h('div', { class: 'banner warn' }, 'Please sign in to see your AI team. ', h('a', { href: '/members' }, 'Go to your members area →')));
}

/* ---------- render ---------- */
/* ---------- the app shell: Home, one short screen per person, four things in the bottom bar ---------- */
var SECTIONS = {
  seo:      [['approvals', 'Changes'], ['activity', 'Activity'], ['esettings', 'Settings']],
  designer: [['gallery', 'Ads'], ['activity', 'Activity'], ['esettings', 'Settings']],
  manager:  [['flags', 'Needs a look'], ['weekly', 'Weekly report'], ['activity', 'Activity'], ['esettings', 'Settings']],
  support:  [['convos', 'Inbox'], ['activity', 'Activity'], ['esettings', 'Settings']]
};
function firstSec(role){ return (SECTIONS[role] || [['activity']])[0][0]; }
function needsBy(role){
  if(!hasRole(role)) return 0;
  if(role === 'seo') return S.approvals.filter(function(a){ return a.role === 'seo'; }).length;
  if(role === 'manager') return managerFlags().length;
  if(role === 'support') return S.threads.filter(needsYou).length;
  return 0;
}
function needsTotal(){ return ['seo', 'manager', 'support'].reduce(function(n, r){ return n + needsBy(r); }, 0); }
var curSheetClose = null;
function navTo(view, sel, sec, o){
  o = o || {};
  var same = S.view === view && S.sel === (view === 'emp' ? sel : null) && S.sec === (view === 'emp' ? (sec || firstSec(sel)) : null);
  if(!o.keepFilter && !same) S.f = null;
  S.view = view; S.sel = view === 'emp' ? sel : null; S.sec = view === 'emp' ? (sec || firstSec(sel)) : null;
  if(!o.noPush && !same){ try{ history.pushState({ v: view, s: S.sel, c: S.sec }, ''); }catch(e){} }
  if(S.office) render();
  if(!same) window.scrollTo(0, 0);
  if(S.sec === 'gallery' && S.loaded) loadAll({ creatives: true });
}
/* old-style "jump to the items behind this number" */
function goTo(tab, f){
  var map = { convos: ['support', 'convos'], reports: ['manager', 'flags'], gallery: ['designer', 'gallery'] };
  if(map[tab]){ navTo('emp', map[tab][0], map[tab][1]); return; }
  S.f = f ? { tab: tab, label: f.label, test: f.test } : null;
  if(S.sel) navTo('emp', S.sel, tab, { keepFilter: true });
  else navTo(tab === 'approvals' ? 'needs' : 'activity', null, null, { keepFilter: true });
}
function render(){
  if(S.sel && !hasRole(S.sel)){ S.view = 'home'; S.sel = null; S.sec = null; }
  renderBanner(); renderHome(); renderTop(); renderNeeds(); renderApprovals('pane-approvals'); renderConvos(); renderFlags(); renderWeekly(); renderActivity(); renderGallery(); renderESettings(); renderSettings(); renderNav(); applyView();
  afterRender();
}
function syncTabs(){ renderNav(); }
function afterRender(){ try{ guideTick(); }catch(e){} }
function applyView(){
  var home = S.view === 'home';
  $('home').hidden = !home; $('top').hidden = home; $('panes').hidden = home;
  var pane = S.view === 'emp' ? S.sec : S.view;
  document.querySelectorAll('.pane').forEach(function(x){ x.classList.toggle('on', x.id === 'pane-' + pane); });
  document.title = (S.view === 'emp' && S.sel ? who(S.sel).name + ' · ' : '') + 'Your AI Team — Sell Products AI';
}
/* what the lists are currently narrowed to: a tapped number */
function scopeBar(tab){
  if(!(S.f && S.f.tab === tab)) return null;
  return h('div', { class: 'filterbar' }, h('span', null, 'Showing: ', h('b', null, S.f.label)),
    h('button', { class: 'btn-sm', type: 'button', on: { click: function(){ S.f = null; render(); } } }, 'Show everything ✕'));
}

function svgIcon(d){
  var NS = 'http://www.w3.org/2000/svg', s = document.createElementNS(NS, 'svg'), p = document.createElementNS(NS, 'path');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', '23'); s.setAttribute('height', '23'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('aria-hidden', 'true');
  p.setAttribute('d', d); s.appendChild(p); return s;
}
var ICON = {
  home: 'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',
  needs: 'M6 9a6 6 0 0112 0c0 6 2.5 8 2.5 8h-17S6 15 6 9M10 20.5a2 2 0 004 0',
  activity: 'M3 12h4l3-8 4 16 3-8h4',
  settings: 'M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6'

  n.appendChild(h('div', { class: 'navin' }, items.map(function(it){
    var on = S.view === it[0] || (it[0] === 'home' && S.view === 'emp'), badge = it[0] === 'needs' && total ? h('span', { class: 'nbadge' }, total > 99 ? '99+' : String(total)) : null;
    return h('button', { class: 'navbtn' + (on ? ' on' : ''), type: 'button', 'aria-current': on ? 'page' : null, on: { click: function(){ navTo(it[0]); } } },
      h('span', { class: 'ni' }, svgIcon(ICON[it[0]]), badge), h('span', { class: 'nl' }, it[1]));
  })));

/* one short line per person for the Home list */
function shortLine(hire){
  var e = hire.employee, st = statusOf(hire), c = (e && e.card) || {}, n = needsBy(hire.role);
  if(st[1] !== 'ok') return st[0];
  if(hire.role === 'support') return n ? plural(n, 'email') + ' need' + (n === 1 ? 's' : '') + ' you' : 'Inbox is clear';
  if(hire.role === 'manager') return n ? plural(n, 'thing') + ' to look at' : (c.last_check ? 'All clear' : 'Getting started');
  if(hire.role === 'seo') return n ? plural(n, 'change') + ' waiting for you' : 'All caught up';
  return c.next_job ? 'Next: ' + (JOB[c.next_job.kind] || 'my next task') : 'All caught up';
}

  return h('button', { class: 'member', type: 'button', 'aria-label': w.name + ', ' + (w.title || hire.label) + '. ' + shortLine(hire), on: { click: function(){ navTo('emp', hire.role); } } },
    h('span', { class: 'avwrap' + (st[1] === 'ok' ? ' live' : (st[1] === 'wait' ? ' live wait' : '')) }, av(hire.role), h('i', { class: 'dot ' + st[1] })),
    h('span', { class: 'mmain' }, h('b', null, w.name), h('span', { class: 'mrole' }, w.title || hire.label), h('span', { class: 'msay' + (n ? ' gold' : '') }, shortLine(hire))),

      h('p', { class: 'note' }, 'Type it into Gmail where it asks you to verify the forwarding address.' + (cl ? ' Or use the link:' : '')),
      cl ? h('a', { class: 'btn btn-sm', href: cl, target: '_blank', rel: 'noopener noreferrer' }, 'Open the confirmation link') : null));
  }
  box.appendChild(h('div', { class: 'pchips', role: 'group', 'aria-label': 'Your email service' }, ['gmail', 'outlook', 'other'].map(function(k){
    return h('button', { class: 'fchip' + (GD.provider === k ? ' on' : ''), type: 'button', 'aria-pressed': String(GD.provider === k), on: { click: function(){ GD.provider = k; render(); } } },
      { gmail: 'Gmail or Google Workspace', outlook: 'Outlook', other: 'Something else' }[k]);
  })));
  var ol = h('ol', { class: 'pst' }); PSTEPS[GD.provider].forEach(function(t){ ol.appendChild(h('li', null, t)); });
  box.appendChild(ol);
  if(GLINK[GD.provider]) box.appendChild(h('a', { class: 'btn btn-sm', style: 'margin-top:10px', href: GLINK[GD.provider], target: '_blank', rel: 'noopener noreferrer' }, GLABEL[GD.provider]));
  box.appendChild(h('div', { class: 'grow' }, h('button', { class: 'btn btn-gold gbig', type: 'button', on: { click: function(){ setStage('test'); render(); } } }, 'I\'ve set it up, test it')));
  return box;
}

function sendTest(to){
  GD.test = 'sending'; GD.err = ''; render();
  api('stest', { method: 'POST', body: to ? { to: to } : {} }).then(function(r){
    var j = r.j || {};
    if(j.ok){ GD.test = 'waiting'; GD.toMasked = j.sent_to_masked || ''; GD.sentAt = Date.now(); GD.askTo = false; startPoll(); }
    else{
      GD.test = 'idle';
      if(j.error === 'no_address' || j.error === 'bad_address'){ GD.askTo = true; GD.err = j.error === 'bad_address' ? 'That doesn\'t look like an email address. Please check it.' : ''; }
      else GD.err = j.error === 'too_many' ? 'That was quite a few tests. Please wait a few minutes, then try again.' : 'We couldn\'t send the test just now. Please try again in a minute.';
    }
    render();
  });
}
function startPoll(){ stopPoll(); GD.poll = setInterval(function(){ loadAll(); }, 5000); }
function stopPoll(){ if(GD.poll){ clearInterval(GD.poll); GD.poll = null; } }
/* runs after every render: notice the test arriving, or give up waiting politely */
function guideTick(){
  var hire = hasRole('support') ? hireOf('support') : null, c = (hire && hire.employee && hire.employee.card) || {}, t = c.forwarding_test || {};
  var fresh = t.sent_at && !t.verified_at && (Date.now() / 1000 - t.sent_at) < 180;
  if(GD.test === 'idle' && fresh){ GD.test = 'waiting'; GD.sentAt = t.sent_at * 1000; GD.toMasked = t.to_masked || ''; startPoll(); }
  if(GD.test === 'waiting' || GD.test === 'slow'){
    if(c.forwarding === 'connected'){ GD.test = 'ok'; GD.ready = true; stopPoll(); setStage('test'); toast('✓ It works! ' + who('support').name + ' will now see your customers\' emails.'); }
    else if(Date.now() - GD.sentAt > 180000){ GD.test = 'idle'; stopPoll(); }
    else if(Date.now() - GD.sentAt > 90000 && GD.test === 'waiting'){ GD.test = 'slow'; render(); }
  }
}

function stepTest(c, w){
  var box = h('div', { class: 'gbody' }), busy = GD.test === 'sending', waiting = GD.test === 'waiting' || GD.test === 'slow';
  if(waiting){
    box.appendChild(h('div', { class: 'waitrow' }, h('span', { class: 'spin', 'aria-hidden': 'true' }),
      h('div', null, h('b', null, GD.test === 'slow' ? 'Still waiting…' : 'Test email sent'),
        h('span', null, 'We sent it to ' + (GD.toMasked || 'your support address') + '. Looking for it in ' + w.name + '\'s inbox now. This usually takes under a minute.'))));
    if(GD.test === 'slow'){
      box.appendChild(h('p', { class: 'gtext', style: 'margin-top:10px' }, 'Not here yet? Check that forwarding is switched on and saved, and look in your spam folder. Gmail also needs the confirmation code from the previous step.'));
      box.appendChild(h('div', { class: 'grow2' },
        h('button', { class: 'btn btn-sm', type: 'button', on: { click: function(){ GD.test = 'idle'; sendTest(null); } } }, 'Send it again'),
        h('button', { class: 'btn btn-sm', type: 'button', on: { click: function(){ stopPoll(); GD.test = 'idle'; setStage('fwd'); render(); } } }, 'Show me the steps again')));
    }
    return box;
  }
  box.appendChild(h('p', { class: 'gtext' }, 'We\'ll email a short test message to your store\'s support address. If forwarding works, it reaches ' + w.name + ' and this screen turns green.'));
  if(GD.err) box.appendChild(h('p', { class: 'gerr', role: 'alert' }, GD.err));
  if(GD.askTo){
    var inp = h('input', { class: 'gin', type: 'email', inputmode: 'email', autocomplete: 'email', placeholder: 'the email your customers write to', 'aria-label': 'Your support email address', value: GD.toValue || '' });
    inp.addEventListener('input', function(){ GD.toValue = inp.value; });
    box.appendChild(h('p', { class: 'gtext' }, 'Which email address do your customers write to?'));
    box.appendChild(inp);
    box.appendChild(h('div', { class: 'grow' }, h('button', { class: 'btn btn-gold gbig', type: 'button', disabled: busy ? 'd' : null, on: { click: function(){ sendTest((inp.value || '').trim()); } } }, busy ? 'Sending…' : 'Send test email')));
  }else{
    box.appendChild(h('div', { class: 'grow' }, h('button', { class: 'btn btn-gold gbig', type: 'button', disabled: busy ? 'd' : null, on: { click: function(){ sendTest(null); } } }, busy ? 'Sending…' : 'Send test email')));
    box.appendChild(h('button', { class: 'linkbtn', type: 'button', on: { click: function(){ GD.askTo = true; render(); } } }, 'Send it to a different address'));
  }
  box.appendChild(h('button', { class: 'linkbtn', type: 'button', on: { click: function(){ setStage('fwd'); render(); } } }, '‹ Back to the forwarding steps'));
  return box;
}

function stepBody(id, hire, c, w){
  if(id === 'fwd') return stepFwd(c, w);
  if(id === 'test') return stepTest(c, w);
  var url = c.order_access && c.order_access.approve_url ? safeUrl(c.order_access.approve_url) : '';
  return h('div', { class: 'gbody' }, h('p', { class: 'gtext' }, 'Your store hasn\'t approved DropStart\'s new order permission yet' + (hire.role === 'support' ? ', so ' + w.name + ' can\'t look up orders when customers ask.' : ', so ' + w.name + ' can\'t see your orders.')),
    h('ol', { class: 'pst' }, [h('li', null, 'Open your Shopify apps page (button below).'), h('li', null, 'Choose DropStart.'), h('li', null, 'Approve the new permissions.')]),
    url ? h('a', { class: 'btn btn-gold gbig', style: 'margin-top:12px;display:inline-block', href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Open my Shopify apps') : null,
    h('p', { class: 'note', style: 'margin-top:8px' }, 'This page updates by itself once you have approved.'));
}

/* the full guide, on the person's own screen */
function guideCard(hire){
  var steps = setupSteps(hire), left = steps.filter(function(s){ return !s.done; }), w = who(hire.role), c = (hire.employee && hire.employee.card) || {};
  if(!left.length) return GD.ready && hire.role === 'support' ? h('div', { class: 'card ready' }, h('span', { class: 'ok-ic', 'aria-hidden': 'true' }, '✓'),
    h('div', null, h('b', null, w.name + ' is ready'), h('span', null, 'Your forwarding works. Every customer email now shows up in ' + w.name + '\'s inbox and he writes a reply for you to approve.'))) : null;
  var cur = left[0], idx = steps.indexOf(cur) + 1, doneN = steps.length - left.length;
  var box = h('div', { class: 'card guide' });
  box.appendChild(h('div', { class: 'ghead' }, av(hire.role, 'xs'), h('div', { class: 'gtt' },
    h('b', null, hire.role === 'support' ? 'Get ' + w.name + ' ready' : 'One step to get ' + w.name + ' working'), h('span', null, steps.length > 1 ? 'Step ' + idx + ' of ' + steps.length + ' · about a minute' : 'Takes about a minute'))));
  if(steps.length > 1) box.appendChild(h('div', { class: 'gbar', 'aria-hidden': 'true' }, h('i', { style: 'width:' + Math.round(100 * doneN / steps.length) + '%' })));
  var ol = h('ol', { class: 'gsteps' });
  steps.forEach(function(s, i){
    var on = s === cur;
    ol.appendChild(h('li', { class: 'gstep' + (s.done ? ' done' : '') + (on ? ' cur' : '') },
      h('span', { class: 'gnum', 'aria-hidden': 'true' }, s.done ? '✓' : String(i + 1)),
      h('div', { class: 'gmain' }, h('div', { class: 'gtitle' }, s.title), on ? stepBody(s.id, hire, c, w) : null)));
  });
  box.appendChild(ol);
  return box;
}
/* the short version on Home: one tap takes them to the guide */
function guideHome(hire){
  var n = setupLeft(hire), w = who(hire.role);
  if(!n) return null;
  return h('button', { class: 'card setupcard', type: 'button', on: { click: function(){ navTo('emp', hire.role, firstSec(hire.role)); } } }, av(hire.role, 'xs'),
    h('div', { class: 'stx' }, h('b', null, 'Finish setting up ' + w.name), h('span', null, plural(n, 'step') + ' left · about a minute')), h('span', { class: 'chev', 'aria-hidden': 'true' }, '›'));
}

/* ----- a store that never approved DropStart's order permission (installed before Oct 29): say exactly what to do ----- */
function permissionNeeded(c){ var oa = (c && c.order_access) || {}; return !!oa.permission_needed; }
function permissionBox(c, name){
  if(!permissionNeeded(c)) return null;
  var url = c.order_access.approve_url ? safeUrl(c.order_access.approve_url) : '';
  return h('div', { class: 'card' }, h('div', { class: 'rhead' }, h('span', { class: 'rk' }, 'One step needed from you')),
    h('p', { class: 'note', style: 'margin-top:8px;color:#D7DEEF' }, 'Your store hasn\'t approved DropStart\'s new order permission yet, so ' + name + ' can\'t see your orders. In Shopify open Settings, then Apps and sales channels, choose DropStart and approve the new permissions. ' + name + ' starts by himself or herself as soon as you have. This page updates by itself.'.replace('himself or herself', name === 'Nora' ? 'herself' : 'himself')),
    url ? h('a', { class: 'btn btn-sm', style: 'margin-top:10px', href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Open my Shopify apps') : null);
}

/* has the merchant's email forwarding started working? (the server counts customer emails that reached Sam's address) */
function forwardingNote(c){
  if(c.forwarding === 'connected') return h('p', { class: 'note', style: 'margin-top:8px;color:#9FE3B5' }, '✓ Forwarding works: ' + plural(c.emails_received || 0, 'email') + ' received' + (c.last_email_at ? ', the last one ' + ago(c.last_email_at) : '') + '.');
  if(c.forwarding === 'waiting') return h('p', { class: 'note', style: 'margin-top:8px' }, 'Waiting for the first email. In your email settings forward your store\'s support email to this address, then send a test message to your store\'s support email from a different address. It shows up here within a minute.');
  return null;
}

/* ----- Sam's card: the address to forward to, and where order details stand ----- */
function addressBox(e, w){
  var c = e.card || {}, a = c.address;
  if(!a) return null;
  return h('div', { class: 'addrbox' }, h('div', { class: 'k' }, 'Your support address'),
    h('div', { class: 'addr' }, h('code', null, addrText(a)), copyBtn(a, 'Copy the support address')),
    h('p', { class: 'note' }, 'Forward your store\'s support email to this address. ' + w.name + ' reads each message, writes a reply and waits for your OK before anything is sent.'),
    c.forwarding === 'connected'
      ? h('p', { class: 'note', style: 'margin-top:8px' }, 'Forwarding works: ' + plural(c.emails_received || 0, 'email') + ' received' + (c.last_email_at ? ', the last one ' + ago(c.last_email_at) : '') + '.')
      : (c.forwarding === 'waiting' ? h('p', { class: 'note', style: 'margin-top:8px' }, 'Waiting for the first email. Set up the forwarding, then send a test message to your store\'s support email from a different address. It shows up here within a minute.') : null),
    permissionNeeded(c)
      ? h('p', { class: 'note', style: 'margin-top:8px' }, 'Order details: your store needs to approve DropStart\'s new permissions first (see Settings). Until then I write order replies without them and say so.')
      : (c.orders_connected === false ? h('p', { class: 'note', style: 'margin-top:8px' }, 'Order details: not connected yet. For order questions I write the reply without them and say so, so you can add the details.') : null));
}

/* ----- Sam's settings: his voice, and the private address ----- */
function supportSettings(){
  var hire = supportHire(), e = hire && hire.employee, s = S.sset;
  if(!e || !s) return null;
  var w = who('support'), tone = s.tone || 'friendly', busy = false;
  var tones = { friendly: ['Friendly', 'Warm and relaxed'], professional: ['Professional', 'Polished and to the point'], casual: ['Casual', 'Short and conversational'] };
  var toneBtns = (s.tones || Object.keys(tones)).map(function(k){
    return h('button', { class: 'tonebtn' + (tone === k ? ' on' : ''), type: 'button', 'data-k': k, 'aria-pressed': String(tone === k), on: { click: function(){
      tone = k; toneBtns.forEach(function(b){ var on = b.getAttribute('data-k') === k; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); toneNote.textContent = (tones[k] || ['', ''])[1]; form.setAttribute('data-dirty', '1');
    } } }, h('b', null, (tones[k] || [k])[0]));
  });
  var toneNote = h('p', { class: 'note', style: 'margin-top:-2px' }, (tones[tone] || ['', ''])[1]);
  var nameI = h('input', { type: 'text', maxlength: '80', 'aria-label': 'Store name' }); nameI.value = s.store_name || '';
  var signI = h('input', { type: 'text', maxlength: '60', 'aria-label': 'Sign-off', placeholder: 'For example: Warm regards, the team' }); signI.value = s.signoff || '';
  var pol = h('textarea', { maxlength: '1500', rows: '6', 'aria-label': 'Your policies', placeholder: 'Shipping times, returns, refunds, what you never offer. I only promise what is written here.' }); pol.value = s.policy || '';
  var cnt = h('span', { class: 'cc2' }, pol.value.length + ' / 1500');
  pol.addEventListener('input', function(){ cnt.textContent = pol.value.length + ' / 1500'; });
  var form = h('div', { class: 'sform' });
  [nameI, signI, pol].forEach(function(x){ x.addEventListener('input', function(){ form.setAttribute('data-dirty', '1'); }); });
  form.appendChild(h('label', { class: 'fl2' }, 'Store name', h('span', { class: 'hint' }, 'Used in sign-offs, never a web address.'), nameI));
  form.appendChild(h('div', { class: 'fl2' }, 'Tone of voice', h('div', { class: 'tones' }, toneBtns), toneNote));
  form.appendChild(h('label', { class: 'fl2' }, 'Sign-off', signI));
  form.appendChild(h('label', { class: 'fl2' }, 'Your policies', h('span', { class: 'hint' }, 'Shipping, returns and refunds, in your own words. ' + w.name + ' only promises what is written here.'), pol, cnt));
  form.appendChild(h('div', { class: 'row' }, h('button', { class: 'btn-gold btn-sm', type: 'button', on: { click: function(ev){
    if(busy) return; busy = true; var b = ev.currentTarget; b.disabled = true;
    api('ssave', { method: 'POST', body: { tone: tone, store_name: nameI.value, signoff: signI.value, policy: pol.value } }).then(function(r){
      busy = false; b.disabled = false;
      if(r.j && r.j.ok){ form.removeAttribute('data-dirty'); toast('Saved. ' + w.name + ' uses this from now on'); loadAll(); } else toast(errMsg(r));
    });
  } } }, 'Save')));
  var card = h('div', { class: 'card' }, h('div', { class: 'rhead' }, av('support', 'xs'), h('span', { class: 'rk' }, w.name + '\'s settings')), form);
  var addr = h('div', { class: 'card' }, h('h3', null, 'Support address'),
    h('div', { class: 'addrbox flat' }, h('div', { class: 'addr' }, h('code', null, addrText(s.address || '')), s.address ? copyBtn(s.address, 'Copy the support address') : null)),
    forwardingNote(e.card || {}),
    h('p', { class: 'note', style: 'margin-top:8px' }, 'Treat this address like a password: anyone who has it can email ' + w.name + '. If it gets out, make a new one. The old one keeps working for a week so replies in progress aren\'t lost, then you update your forwarding.'),
    h('div', { class: 'row' }, h('button', { class: 'btn-sm', type: 'button', on: { click: function(){
      confirmModal({ role: 'support', title: 'Make a new support address?', text: 'The old address keeps working for a week. After that, only the new one works, so update your email forwarding.', ok: 'Make a new one', cancel: 'Keep this one' })
        .then(function(yes){ if(yes) api('saddress', { method: 'POST' }).then(function(r){ if(r.j && r.j.ok){ toast('New address ready'); loadAll(); } else toast(errMsg(r)); }); });
    } } }, 'Make a new address')));
  return [card, addr];
}

/* ---------- actions ---------- */
var ERR = { token_problem: 'Your store connection needs attention first.', busy: 'Your team is in the middle of a task. Try again in a minute.', upstream: 'We couldn\'t reach your team just now. Please try again.',
  offline: 'You seem to be offline. Please try again.', error: 'Something went wrong. Please try again.', login_required: 'Please sign in again.' };
function errMsg(r){
  var j = r.j || {}, code = j.code || j.error;
  if(r.status === 429) return 'Please wait a moment and try again.';
  if(code && ERR[code]) return ERR[code];
  return typeof j.error === 'string' && j.error.indexOf(' ') > 0 ? j.error : 'Something went wrong. Please try again.';
}
/* say what the server actually did, not what the button hoped for */
var REPLYERR = { customer_wrote_again: 'They wrote again since I drafted this, so I held it back. Open the conversation to read their new message.', sender_blocked: 'This sender is blocked, so nothing was sent.',
  send_failed: 'It didn\'t go out. Open the conversation and tap Get it ready to send.', draft_gone: 'That draft is no longer there. Ask me to write a fresh one.' };
function outcome(route, j, okMsg, o){
  var st = j.status;
  if(route === 'approve' && o && o.reply && st && st !== 'applied' && j.error && REPLYERR[j.error]) return REPLYERR[j.error];
  if(route === 'approve' && o && o.reply && st && st !== 'applied') return { failed: 'It didn\'t go out. Open the conversation and tap Get it ready to send.', skipped: 'I didn\'t send it: the conversation changed since I wrote it.', expired: 'That reply had expired. Ask me to write a fresh one.', applying: 'That reply is already on its way.' }[st] || 'That reply was not sent.';
  if(route === 'approve' && st && st !== 'applied') return { skipped: 'Not applied: the text changed in your store since this was written.', failed: 'I couldn\'t apply that one just now.', expired: 'That suggestion had expired.', applying: 'That one is already being applied.' }[st] || 'Not applied.';
  if(route === 'undo' && st && st !== 'undone') return 'An undo is already running. Give it a moment.';
  if(route === 'bulk'){ var n = j.processed || 0, bad = j.not_applied || 0; return n + ' approved' + (bad ? ', ' + bad + ' couldn\'t be applied' : ''); }
  return okMsg || 'Done';
}
function act(route, q, okMsg, body, o){
  return api(route, { method: 'POST', q: q, body: body }).then(function(r){
    var j = r.j || {};
    toast(j.ok !== false && r.status < 400 ? outcome(route, j, okMsg, o) : errMsg(r));
    return loadAll();
  }).then(function(){ if(S.office) render(); }); /* redraw even when the reload failed, so no button stays disabled */
}

/* ---------- boot ---------- */
try{ history.replaceState({ v: 'home' }, ''); }catch(e){}
window.addEventListener('popstate', function(ev){
  if(curSheetClose){ curSheetClose(); return; }
  var st = ev.state || { v: 'home' };
  if(st.sheet) return;
  navTo(st.v || 'home', st.s || null, st.c || null, { noPush: true });
});
loadAll();
function editing(){
  var a = document.activeElement;
  if(a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) return true;
  return modalOpen || sheetOpen || !!document.querySelector('[data-dirty], details[open]');
}
setInterval(function(){ if(document.visibilityState === 'visible' && S.loaded && !editing()) loadAll(); }, 60000);
})();
</script>
